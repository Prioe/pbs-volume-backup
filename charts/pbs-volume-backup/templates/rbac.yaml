apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pvb.fullname" . }}
  labels:
    {{- include "pvb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pvb.fullname" . }}
  labels:
    {{- include "pvb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [list, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots, volumesnapshotcontents]
    verbs: [list, get, create, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pvb.fullname" . }}
  labels:
    {{- include "pvb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pvb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pvb.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pvb.fullname" . }}
  labels:
    {{- include "pvb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, get, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pvb.fullname" . }}
  labels:
    {{- include "pvb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pvb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pvb.fullname" . }}
    namespace: {{ .Release.Namespace }}
